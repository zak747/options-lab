[project]
name = "optionslab"
version = "0.1.0"
description = "Options pricing, implied volatility surfaces and VIX reconstruction, benchmarked against published reference values."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
